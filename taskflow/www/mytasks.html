<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/taskflow/frontend/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskflow</title>
    <script type="module" crossorigin src="/assets/taskflow/frontend/assets/index-J_J3EGMp.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/taskflow/frontend/assets/index-vEaiV5AN.css">
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased">
    <div id="app"></div>
    <div id="modals"></div>
    <div id="popovers"></div>

    <script>
      window.csrf_token = '{{ csrf_token }}';
      window.site_name = '{{ site_name }}';
      if (!window.frappe) window.frappe = {};
      window.frappe.boot = {{ (boot or {}) | tojson }};
    </script>
  
          <script>
              {% for key in boot %}
              window["{{ key }}"] = {{ boot[key] | tojson }};
              {% endfor %}
          </script>
          </body>
          
</html>
